name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-tests:
    name: Game tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run game regression suite
        run: npm test

      - name: Check tracked documentation destinations
        run: python3 scripts/check_doc_links.py
      - name: Test documentation link regressions
        run: python3 -m unittest discover -s tests -p test_doc_links.py
      - name: Validate vendored runtime identity
        run: python3 scripts/check_advisories.py --offline
      - name: Test advisory checker
        run: python3 -m unittest discover -s tests -p test_advisories.py
      - name: Check current Three.js advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_advisories.py
