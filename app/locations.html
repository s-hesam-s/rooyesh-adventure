<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اطلس محیط‌های آفتاب</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./locations.css"><script type="module" src="./src/locations.js"></script></head>
<body><canvas id="world" tabindex="0" aria-label="پیش‌نمایش سه‌بعدی محیط انتخابی"></canvas><aside class="location-panel"><a href="./">← بازگشت به بازی</a><h1>اطلس محیط‌های آفتاب</h1><p>این بخش فقط برای دیدن محیط‌هاست و پیشرفت بازی را تغییر نمی‌دهد.</p><label for="location">مأموریت و محیط</label><select id="location"></select><div class="location-buttons"><button id="previous">قبلی</button><button id="next">بعدی</button><button id="view">دید اول‌شخص</button></div><label for="preview-role">شخصیت در پیش‌نمایش تعامل</label><select id="preview-role"><option value="">شخصیت همین مرحله</option value="manager">سارا · مدیر مالی</option><option value="owner">نادر · سرمایه‌پذیر</option><option value="client">آرمان · سرمایه‌گذار حقیقی</option><option value="legal">لیلا · سرمایه‌گذار حقوقی</option></select><div id="handling-preview"><button id="handling-play">نمایش برداشتن پرونده</button><label for="handling-phase">بررسی حرکت پرونده</label><select id="handling-phase"><option value="">پخش پیوسته</option><option value="1.7">نگه‌داشتن پرونده</option><option value="2.65">بازکردن کیف</option><option value="3.45">گذاشتن پرونده</option><option value="4.3">بستن کیف</option></select></div><div id="door-preview"><label for="door-choice">ورودی محیط</label><select id="door-choice"><option value="0">در سمت چپ</option><option value="1">در روبه‌رو</option><option value="2">در سمت راست</option></select><button id="door-play">نمایش بازکردن در و عبور</button><label for="door-phase">بررسی حرکت در</label><select id="door-phase"><option value="">پخش پیوسته</option><option value="0">در بسته</option><option value="0.45">گرفتن دستگیره</option><option value="0.9">آغاز بازشدن</option><option value="1.2">بازکردن لنگه‌ها</option><option value="2.3">عبور از در</option></select><button id="guide-view">نمای نزدیک راهنما</button></div><h2 id="location-name"></h2><p id="guide-name"></p><p id="location-task"></p><small id="view-help">نمای کلی محیط؛ با «دید اول‌شخص» وارد صحنه شو.</small><small id="location-performance"></small><p id="location-status" role="status">در حال بارگذاری محیط‌ها…</p></aside></body></html>
